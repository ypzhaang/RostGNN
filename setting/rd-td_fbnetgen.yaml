data:
  dataset: RD-TD
  batch_size: 5
  test_batch_size: 1
  val_batch_size: 1
  train_set: 0.7
  val_set: 0
  time_seires: /mnt/5468e/ypzhang/LiYuxin/RD-TD/rd_td.npy

model:
  # seq, gnn, fbnetgen 
  type: fbnetgen

  # gru or cnn 
  extractor_type: gru
  embedding_size: 8
  window_size: 4

  cnn_pool_size: 16

  # product or linear
  graph_generation: product

  num_gru_layers: 4

  dropout: 0.5
  reduced_matrix: false
  shrink_matrix: false
  ratio: 80


train:
  # normal or bilevel 
  method: normal
  lr: 1.0e-4
  weight_decay: 1.0e-4
  epochs: 500
  optimizer: adam

  group_loss: true
  sparsity_loss: false
  sim_loss: true

  sparsity_loss_weight: 1.0e-4
  sim_loss_weight: 1.0e-4
  
  log_folder: result
  
  # uniform or pearson
  pure_gnn_graph: pearson
